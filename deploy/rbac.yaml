apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-labeler-operator
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-labeler-operator
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, update]
  - apiGroups: [labeler.barpilot.io]
    resources: [labelers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-labeler-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-labeler-operator
subjects:
  - kind: ServiceAccount
    name: node-labeler-operator
    namespace: kube-system
