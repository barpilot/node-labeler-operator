apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-labeler-operator
  namespace: kube-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: node-labeler-operator
  template:
    metadata:
      labels:
        app: node-labeler-operator
    spec:
      serviceAccountName: node-labeler-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # Build and load this tag locally, or replace it with your published image.
          image: node-labeler-operator:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
